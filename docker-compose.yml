version: '3.8'

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MongoDB database (for app-server)
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: llm_service
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL with pgvector (for template storage)
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: llm_templates
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: llm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_templates"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Adminer (Database UI for PostgreSQL)
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=nette
    depends_on:
      - postgres
      - mongo

  # Gateway Service (FastAPI)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=duckdb:///./gateway.db
      - POSTGRES_URL=postgresql://llm_user:llm_password@postgres:5432/llm_templates
    volumes:
      - ./gateway:/app
      - gateway_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # App Server (Next.js)
  app-server:
    build:
      context: ./app-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://gateway:8000
      - MONGODB_URI=mongodb://mongo:27017/llm_service
      - ALLOW_LOCALHOST_BYPASS=true
    volumes:
      - ./app-server:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - gateway
      - mongo
    command: npm run dev

  # Playground (Next.js)
  playground:
    build:
      context: ./playground
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8000
    volumes:
      - ./playground:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  # Web Chat (React)
  web-chat:
    build:
      context: ./web-chat
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
    volumes:
      - ./web-chat:/app
      - /app/node_modules
    command: npm start

volumes:
  redis_data:
  mongo_data:
  postgres_data:
  gateway_data:
