version: '3.8'

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MongoDB database (for app-server)
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: llm_service
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Gateway Service (FastAPI)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=duckdb:///./gateway.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./gateway:/app
      - gateway_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # App Server (Next.js)
  app-server:
    build:
      context: ./app-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://gateway:8000
      - MONGODB_URI=mongodb://mongo:27017/llm_service
    volumes:
      - ./app-server:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - gateway
      - mongo
    command: npm run dev

  # Playground (Next.js)
  playground:
    build:
      context: ./playground
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8000
    volumes:
      - ./playground:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  # Web Chat (React)
  web-chat:
    build:
      context: ./web-chat
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
    volumes:
      - ./web-chat:/app
      - /app/node_modules
    command: npm start

volumes:
  redis_data:
  mongo_data:
  gateway_data:
