<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Aikido Gateway - Reference Client</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🥋 AI Aikido Gateway</h1>
            <p class="subtitle">Reference Client</p>
        </header>

        <div class="status-bar">
            <span class="status-label">Gateway:</span>
            <span id="gateway-url">http://localhost:8000</span>
            <span id="connection-status" class="status-indicator">●</span>
        </div>

        <div class="chat-container">
            <div class="input-section">
                <label for="message-input">Your Message:</label>
                <textarea 
                    id="message-input" 
                    placeholder="Type your message here..."
                    rows="4"
                ></textarea>
                
                <div class="controls">
                    <div class="model-controls">
                        <select id="model-select">
                            <option value="">Loading models...</option>
                        </select>
                        <label class="checkbox-label">
                            <input type="checkbox" id="supported-only" checked onchange="loadModels()">
                            <span>Show supported models only</span>
                        </label>
                    </div>
                    <button id="send-btn" onclick="sendMessage()">
                        <span id="btn-text">Send</span>
                        <span id="btn-spinner" class="spinner" style="display: none;">⟳</span>
                    </button>
                </div>
            </div>

            <div class="response-section">
                <label>Response:</label>
                <div id="response-display" class="response-box">
                    <p class="placeholder">Response will appear here...</p>
                </div>
            </div>

            <div class="metadata-section">
                <label>Request Metadata:</label>
                <pre id="metadata-display" class="metadata-box">No request sent yet</pre>
            </div>
        </div>

        <footer>
            <p>Gateway Status: <span id="gateway-status">Not checked</span></p>
            <button onclick="checkHealth()" class="secondary-btn">Check Gateway Health</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
