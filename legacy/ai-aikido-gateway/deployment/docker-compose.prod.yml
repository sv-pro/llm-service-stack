# AI Aikido Gateway - Production Docker Compose Configuration
# This file extends docker-compose.yml for production deployment

services:
  # Gateway Service (Production optimized)
  gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.gateway
    container_name: aikido-gateway-prod
    ports:
      - "8000:8000"
    environment:
      # Production settings
      - GATEWAY_HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - DB_PATH=/app/data

      # LLM API keys (should be set via Docker secrets or external env)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Model configuration
      - CLASSIFIER_MODEL=${CLASSIFIER_MODEL:-claude-3-haiku-20240307}
      - CLASSIFIER_MAX_TOKENS=${CLASSIFIER_MAX_TOKENS:-100}
      - CHEAP_MODEL=${CHEAP_MODEL:-claude-3-haiku-20240307}
      - EXPENSIVE_MODEL=${EXPENSIVE_MODEL:-gpt-4-turbo-preview}
    volumes:
      # Persistent storage for SQLite databases
      - ../data:/app/data
      # Configuration files (read-only)
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - aikido-network-prod

  # Dashboard Service (Production optimized)
  dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.dashboard
    container_name: aikido-dashboard-prod
    ports:
      - "3000:3000"
    environment:
      # Production API URL (should point to actual gateway URL)
      - VITE_API_URL=${GATEWAY_URL:-http://localhost:8000}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - aikido-network-prod

# Production network with custom subnet
networks:
  aikido-network-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
