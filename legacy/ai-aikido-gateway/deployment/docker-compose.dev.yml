# AI Aikido Gateway - Development Docker Compose Configuration
# This file extends docker-compose.yml for development with hot reload

services:
  # Gateway Service (Development mode with hot reload)
  gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.gateway
      target: development # We'll add a development stage
    container_name: aikido-gateway-dev
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    environment:
      # Development settings
      - GATEWAY_HOST=0.0.0.0
      - LOG_LEVEL=DEBUG
      - DB_PATH=/app/data
      - PYTHONPATH=/app:/app/src

      # LLM API keys provided via env_file

      # Model configuration
      - CLASSIFIER_MODEL=${CLASSIFIER_MODEL:-claude-3-haiku-20240307}
      - CLASSIFIER_MAX_TOKENS=${CLASSIFIER_MAX_TOKENS:-100}
      - CHEAP_MODEL=${CHEAP_MODEL:-claude-3-haiku-20240307}
      - EXPENSIVE_MODEL=${EXPENSIVE_MODEL:-gpt-4-turbo-preview}
      - RE_RE_TELEMETRY_REDIS_URL=redis://redis:6379/0
    volumes:
      # Hot reload - mount source code
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      # Persistent data
      - ../data:/app/data
    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "'*'",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - aikido-network-dev
    depends_on:
      redis:
        condition: service_started

  # Dashboard Service (Development mode with Vite dev server)
  dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.dev.dashboard
    container_name: aikido-dashboard-dev
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://gateway:8000
      - VITE_WS_URL=ws://gateway:8000
    volumes:
      # Hot reload - mount dashboard source
      - ../dashboard/src:/app/src:ro
      - ../dashboard/public:/app/public:ro
      - ../dashboard/package.json:/app/package.json:ro
      - ../dashboard/vite.config.js:/app/vite.config.js:ro
      - ../dashboard/index.html:/app/index.html:ro
    depends_on:
      gateway:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    restart: unless-stopped
    networks:
      - aikido-network-dev

# Redis service for local telemetry/caching
  redis:
    image: redis:7.4-alpine
    container_name: aikido-redis-dev
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data
    restart: unless-stopped
    networks:
      - aikido-network-dev

# Development network
networks:
  aikido-network-dev:
    driver: bridge
