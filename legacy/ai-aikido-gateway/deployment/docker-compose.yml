# AI Aikido Gateway - Docker Compose Configuration

services:
  # Gateway Service (FastAPI Backend)
  gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.gateway
    container_name: aikido-gateway
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    environment:
      # Application settings
      GATEWAY_HOST: 0.0.0.0
      LOG_LEVEL: INFO
      DB_PATH: /app/data
      GATEWAY_DATA_DIR: /app/data

      # Provider credentials (optional; set via shell env or Compose .env)
      # Provider credentials now supplied via env_file (../.env)

      # Model configuration
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-claude-3-haiku-20240307}
      CLASSIFIER_MAX_TOKENS: ${CLASSIFIER_MAX_TOKENS:-100}
      CHEAP_MODEL: ${CHEAP_MODEL:-claude-3-haiku-20240307}
      EXPENSIVE_MODEL: ${EXPENSIVE_MODEL:-gpt-4-turbo-preview}
      RE_RE_TELEMETRY_REDIS_URL: redis://redis:6379/0
    volumes:
      # Persistent storage for SQLite databases
      - ../data:/app/data
      # Configuration files (optional, for custom configs)
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - aikido-network
    depends_on:
      redis:
        condition: service_healthy

  # Dashboard Service (React Frontend)
  dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.dashboard
    container_name: aikido-dashboard
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    environment:
      # Dashboard configuration (browser hits localhost)
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - aikido-network

  # Embedding Service (Sentence-Transformers)
  embeddings:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.embeddings
    container_name: aikido-embeddings
    ports:
      - "8001:8001"
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - aikido-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: aikido-qdrant
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if ! command -v wget >/dev/null 2>&1; then
          apt-get update && apt-get install -y wget
        fi
        exec ./entrypoint.sh
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - http://localhost:6333/healthz >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - aikido-network

  # Redis (Telemetry Pub/Sub + future caching)
  redis:
    image: redis:7.4-alpine
    container_name: aikido-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aikido-network

# Custom network for service communication
networks:
  aikido-network:
    driver: bridge

# Persistent storage volumes
volumes:
  qdrant-storage:
  redis-data:
