version: '3.8'

services:
  embeddings:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.embeddings
    container_name: aikido-embeddings
    ports:
      - "8001:8001"
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - aikido-network

networks:
  aikido-network:
    driver: bridge
